<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>器落山河</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a0a15;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-canvas {
            display: block;
            image-rendering: auto;
        }
        #game-toast {
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- 游戏模块 (IIFE 打包 → window.GameModules) -->
    <script src="dist/game-modules.js"></script>

    <script>
        // require() 适配 — game.js 用 require('./dist/game-modules.js') 加载模块
        var _requireCache = {
            './dist/game-modules.js': window.GameModules
        };
        function require(path) {
            if (_requireCache[path]) return _requireCache[path];
            console.warn('[require] 未知模块:', path);
            return {};
        }
    </script>

    <!-- Canvas 预初始化：CSS 宽度比例缩放，高度填满全屏。物理像素由 game.js init() 管理 -->
    <script>
        function resizeCanvas() {
            var canvas = document.getElementById('game-canvas');
            var container = document.getElementById('game-container');
            var maxW = container.clientWidth;
            var maxH = container.clientHeight;
            var DW = 375;
            var DH = 812;
            var scale = Math.min(maxW / DW, maxH / DH);
            scale = Math.max(0.7, Math.min(2.5, scale));
            canvas.style.width = Math.floor(DW * scale) + 'px';
            canvas.style.height = Math.floor(maxH) + 'px';
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
    </script>

    <!-- 主游戏逻辑 -->
    <script src="game.js"></script>
</body>
</html>
